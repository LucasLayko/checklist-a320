<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Airbus A320 EFB - Normal & Emergency Procedures</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b0e14;
            color: #d0d7de;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* HEADER FIXE EFB AIRBUS */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #161b22;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #30363d;
            z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-logo {
            background: #00ffff;
            color: #000000;
            font-weight: 900;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            letter-spacing: 1px;
            font-family: monospace;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #8b949e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50vw;
            font-family: monospace;
        }
        .header-right { display: flex; gap: 10px; }
        .btn-efb {
            background-color: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-efb:active { background-color: #30363d; }
        .btn-reset-all { color: #f0883e; border-color: #f0883e; }

        /* CONTENEUR PRINCIPAL */
        .main-content {
            margin-top: 80px;
            padding: 0 20px 40px 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        /* VUE 1 : MENU CATÉGORIES */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
        .card-category {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-left: 5px solid #00ffff;
            padding: 22px;
            border-radius: 8px;
            cursor: pointer;
        }
        .card-category.emergency-cat {
            border-left-color: #ff4d4d;
        }
        .card-category:active { background-color: #1c2128; }
        .cat-tag { font-size: 11px; color: #8b949e; font-weight: bold; margin-bottom: 6px; font-family: monospace; }
        .cat-title { font-size: 17px; font-weight: bold; color: #00ffff; font-family: monospace; }
        .emergency-cat .cat-title { color: #ff4d4d; }

        /* VUE 2 : LISTE DES CHECKLISTS */
        .list-group-title {
            color: #8b949e;
            font-size: 13px;
            font-weight: bold;
            margin: 24px 0 10px 0;
            border-bottom: 1px solid #21262d;
            padding-bottom: 6px;
            font-family: monospace;
        }
        .card-checklist {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 18px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .card-checklist:active { background-color: #21262d; }
        .chk-title { font-size: 16px; font-weight: bold; color: #e6edf3; font-family: monospace; }
        .chk-count { font-size: 12px; color: #8b949e; font-family: monospace; }

        /* VUE 3 : CHECKLIST INTERACTIVE */
        .checklist-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }
        .item-row {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid #21262d;
            cursor: pointer;
            background-color: #161b22;
        }
        .item-row:last-child { border-bottom: none; }
        .item-row:active { background-color: #1c2128; }

        .challenge {
            color: #00ffff;
            font-size: 15px;
            font-weight: bold;
            font-family: monospace;
            white-space: nowrap;
        }

        .dots-wrapper {
            overflow: hidden;
            white-space: nowrap;
            color: #30363d;
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .response {
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            font-family: monospace;
            text-align: right;
            white-space: nowrap;
        }

        .checkbox-box {
            width: 28px;
            height: 28px;
            border: 2px solid #484f58;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: transparent;
            margin-left: 8px;
        }

        .item-row.checked .challenge,
        .item-row.checked .response {
            color: #00ff00 !important;
        }
        .item-row.checked .checkbox-box {
            border-color: #00ff00;
            background-color: rgba(0, 255, 0, 0.15);
            color: #00ff00;
        }

        /* STYLE ROUGE POUR LES PROCÉDURES D'URGENCE */
        .emergency-mode .challenge { color: #ff4d4d; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <span class="app-logo">FLYSMART</span>
            <span id="header-title" class="header-title">A320 NORMAL & eQRH</span>
        </div>
        <div class="header-right">
            <button id="btn-back" class="btn-efb" onclick="goBack()" style="display:none;">&lt; BACK</button>
            <button id="btn-reset-all" class="btn-efb btn-reset-all" onclick="resetAllChecklists()">RESET ALL</button>
        </div>
    </header>

    <div class="main-content">
        <div id="view-categories" class="grid-menu"></div>
        <div id="view-list" style="display:none;"></div>
        <div id="view-checklist" style="display:none;"></div>
    </div>

    <script>
        const database = [
            {
                id: "normal",
                tag: "NORMAL PROCEDURES",
                title: "01. NORMAL PROCEDURES",
                isEmergency: false,
                groups: [
                    {
                        name: "PRE-FLIGHT & START",
                        checklists: [
                            {
                                id: "np_cp",
                                name: "COCKPIT PREPARATION",
                                items: [
                                    { c: "BATTERIES", r: "ON" },
                                    { c: "INTERIOR LIGHTS", r: "AS REQUIRED" },
                                    { c: "CHOCKS/PARKING BRAKE", r: "SET/OFF" },
                                    { c: "WIPERS", r: "OFF" },
                                    { c: "ANTI-SKID", r: "ON" },
                                    { c: "LANDING GEAR LEVER", r: "DOWN" },
                                    { c: "THRUST LEVERS", r: "IDLE" },
                                    { c: "ENGINE MASTERS", r: "OFF" },
                                    { c: "ENGINE MODE SELECTOR", r: "NORMAL" },
                                    { c: "WEATHER RADAR/PWS", r: "OFF" },
                                    { c: "SPOILERS", r: "DISARMED & RETRACTED" },
                                    { c: "FLAPS", r: "ZERO" },
                                    { c: "TRANSPONDER", r: "STANDBY" },
                                    { c: "TCAS", r: "STANDBY" },
                                    { c: "ELECTRICAL POWER", r: "(EXT or APU) ON" },
                                    { c: "ADIRS", r: "NAV" },
                                    { c: "GROUND CONTROL", r: "ON" },
                                    { c: "CREW SUPPLY", r: "ON" },
                                    { c: "AIR CONDITION", r: "AS REQUIRED" },
                                    { c: "NAV & LOGO LIGHTS", r: "ON" },
                                    { c: "NO SMOKING SIGNS", r: "AUTO" },
                                    { c: "EMERGENCY EXIT LIGHTS", r: "ARMED" },
                                    { c: "ECAM RECALL/STATUS", r: "CHECKED" },
                                    { c: "RADIO PANELS", r: "ON" },
                                    { c: "FIRE TESTS", r: "PERFORMED" },
                                    { c: "ANNUNCIATOR LIGHTS", r: "TEST" },
                                    { c: "CIRCUIT BREAKERS", r: "ALL ON" },
                                    { c: "GEAR PINS/COVERS", r: "REMOVED" }
                                ]
                            },
                            {
                                id: "np_bs",
                                name: "BEFORE START",
                                items: [
                                    { c: "APU/APU BLEED", r: "ON" },
                                    { c: "BARO REFERENCE", r: "( )SET" },
                                    { c: "FUEL QUANTITY", r: "( )KG" },
                                    { c: "TAKEOFF DATA", r: "SET" },
                                    { c: "SEATBELT SIGNS", r: "ON" },
                                    { c: "WINDOWS/DOORS", r: "CLOSED/LOCKED" },
                                    { c: "GROUND EQUIPMENT", r: "REMOVED" },
                                    { c: "EXT POWER/GPU", r: "OFF/DISCONNECTED" },
                                    { c: "FUEL PUMPS", r: "ON" },
                                    { c: "ACCUMULATOR PRESSURE", r: "CHECKED" },
                                    { c: "PARKING BRAKE/CHOCKS", r: "ON/REMOVED" },
                                    { c: "THRUST LEVERS", r: "IDLE" },
                                    { c: "TRANSPONDER", r: "( )AUTO" },
                                    { c: "BEACON LIGHTS", r: "ON" }
                                ]
                            },
                            {
                                id: "np_as",
                                name: "AFTER START",
                                items: [
                                    { c: "PARKING BRAKE", r: "ON" },
                                    { c: "ENGINE MODE SELECTOR", r: "NORMAL" },
                                    { c: "APU BLEED/APU", r: "OFF" },
                                    { c: "ANTI-ICE", r: "AS REQUIRED" },
                                    { c: "FLIGHT CONTROLS", r: "CHECKED" },
                                    { c: "SPOILERS", r: "ARMED" },
                                    { c: "FLAPS", r: "SET T/O" },
                                    { c: "RUDDER TRIM", r: "ZERO" },
                                    { c: "PITCH TRIM", r: "AS REQUIRED" },
                                    { c: "BRAKES PRESS", r: "CHECK PRESSURE" },
                                    { c: "ECAM STATUS", r: "CHECKED" },
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" }
                                ]
                            },
                            {
                                id: "np_bto",
                                name: "BEFORE TAKE OFF",
                                items: [
                                    { c: "CABIN", r: "ADVISED" },
                                    { c: "BRAKE TEMPERATURE/FANS", r: "CHECKED/OFF" },
                                    { c: "ENGINE MODE SELECTOR", r: "AS REQUIRED" },
                                    { c: "PACKS", r: "AS REQUIRED" },
                                    { c: "WEATHER RADAR/PWS", r: "AS REQUIRED/ON" },
                                    { c: "TCAS", r: "TA/RA & ABV" },
                                    { c: "AUTO BRAKES", r: "MAX" },
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" },
                                    { c: "STROBE LIGHTS", r: "ON" },
                                    { c: "T/O CONFIG/ECAM MEMO", r: "T/O NO BLUE" }
                                ]
                            }
                        ]
                    },
                    {
                        name: "CLIMB, DESCENT & LANDING",
                        checklists: [
                            {
                                id: "np_ato",
                                name: "AFTER TAKE OFF/CLIMB",
                                items: [
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" },
                                    { c: "LANDING GEAR", r: "UP" },
                                    { c: "THRUST LEVERS", r: "CLIMB" },
                                    { c: "ENGINE MODE SELECTOR", r: "NORMAL" },
                                    { c: "SPOILERS", r: "DISARMED" },
                                    { c: "FLAPS", r: "ZERO" },
                                    { c: "PACKS", r: "ON" },
                                    { c: "ANTI-ICE", r: "AS REQUIRED" },
                                    { c: "ECAM STATUS", r: "CHECKED" },
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" },
                                    { c: "BARO REFERENCE", r: "STD" },
                                    { c: "ECAM STATUS", r: "CHECKED" }
                                ]
                            },
                            {
                                id: "np_da",
                                name: "DESCENT/APPROACH",
                                items: [
                                    { c: "TCAS", r: "BLW" },
                                    { c: "ON LANDING DATA", r: "SET" },
                                    { c: "ECAM STATUS", r: "CHECKED" },
                                    { c: "BARO REFERENCE", r: "( )SET" },
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" }
                                ]
                            },
                            {
                                id: "np_bl",
                                name: "BEFORE LANDING",
                                items: [
                                    { c: "CABIN", r: "ADVISED" },
                                    { c: "LANDING GEAR", r: "DOWN" },
                                    { c: "FLAPS", r: "SET LDG" },
                                    { c: "SPOILERS", r: "ARMED" },
                                    { c: "AUTO BRAKE", r: "AS REQUIRED" },
                                    { c: "ENGINE MODE SELECTOR", r: "AS REQUIRED" },
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" },
                                    { c: "GO AROUND ALTITUDE", r: "SET FCU" },
                                    { c: "ECAM MEMO", r: "LDG NO BLUE" }
                                ]
                            },
                            {
                                id: "np_al",
                                name: "AFTER LANDING",
                                items: [
                                    { c: "BRAKE FANS", r: "AS REQUIRED" },
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" },
                                    { c: "STROBE LIGHTS", r: "OFF" },
                                    { c: "ANTI-ICE", r: "OFF" },
                                    { c: "FLAPS", r: "ZERO" },
                                    { c: "SPOILERS", r: "DISARMED & RETRACTED" },
                                    { c: "ENGINE MODE SELECTOR", r: "NORMAL" },
                                    { c: "WEATHER RADAR/PWS", r: "OFF" },
                                    { c: "TCAS", r: "STBY" },
                                    { c: "APU", r: "ON" }
                                ]
                            }
                        ]
                    },
                    {
                        name: "PARKING & SHUTDOWN",
                        checklists: [
                            {
                                id: "np_pk",
                                name: "PARKING",
                                items: [
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" },
                                    { c: "BRAKE FANS", r: "OFF" },
                                    { c: "PARKING BRAKE", r: "ON" },
                                    { c: "ENGINE MASTERS", r: "OFF" },
                                    { c: "BEACON", r: "OFF" },
                                    { c: "FUEL PUMPS", r: "OFF" },
                                    { c: "SEATBELT SIGNS", r: "OFF" },
                                    { c: "TRANSPONDER", r: "STBY" },
                                    { c: "CHOCKS/PARKING BRAKE", r: "SET/OFF" },
                                    { c: "ELECTRICAL POWER", r: "(EXT or APU) ON" },
                                    { c: "APU BLEED", r: "AS REQUIRED" }
                                ]
                            },
                            {
                                id: "np_sd",
                                name: "SHUTDOWN",
                                items: [
                                    { c: "ADIRS", r: "OFF" },
                                    { c: "CREW SUPPLY", r: "OFF" },
                                    { c: "NAV & LOGO LIGHTS", r: "OFF" },
                                    { c: "NO SMOKING SIGNS", r: "OFF" },
                                    { c: "EMERGENCY EXIT LIGHTS", r: "OFF" },
                                    { c: "APU BLEED/APU", r: "OFF" },
                                    { c: "EXTERNAL POWER/GPU", r: "OFF/DISCONNECTED" },
                                    { c: "INTERIOR LIGHTS", r: "OFF" },
                                    { c: "BATTERIES", r: "OFF" }
                                ]
                            }
                        ]
                    }
                ]
            },
            {
                id: "emergency",
                tag: "EMERGENCY & eQRH",
                title: "02. EMERGENCY PROCEDURES",
                isEmergency: true,
                groups: [
                    {
                        name: "ENGINE & FIRE PROCEDURES",
                        checklists: [
                            {
                                id: "em_eng_fire",
                                name: "ENG 1(2) FIRE IN FLIGHT",
                                items: [
                                    { c: "THRUST LEVER (AFFECTED)", r: "IDLE" },
                                    { c: "ENG MASTER (AFFECTED)", r: "OFF" },
                                    { c: "ENG FIRE BUTTON", r: "PUSH" },
                                    { c: "AGENT 1 (AFTER 10s)", r: "DISCHARGE" },
                                    { c: "AGENT 2 (IF FIRE PERSISTS 30s)", r: "DISCHARGE" },
                                    { c: "ATC", r: "MAYDAY NOTIFY" }
                                ]
                            },
                            {
                                id: "em_apu_fire",
                                name: "APU FIRE IN FLIGHT / ON GND",
                                items: [
                                    { c: "APU FIRE BUTTON", r: "PUSH" },
                                    { c: "APU AGENT", r: "DISCHARGE" }
                                ]
                            },
                            {
                                id: "em_dual_eng_fail",
                                name: "ENG DUAL FAILURE",
                                items: [
                                    { c: "OPTIMUM SPEED", r: "300 KT / GREEN DOT" },
                                    { c: "ENG MASTERS", r: "OFF / ON" },
                                    { c: "APU MASTER", r: "ON" }
                                ]
                            }
                        ]
                    },
                    {
                        name: "CABIN & AIRFRAME EMERGENCIES",
                        checklists: [
                            {
                                id: "em_emg_descent",
                                name: "EMERGENCY DESCENT",
                                items: [
                                    { c: "CREW OXY MASKS", r: "ON / 100%" },
                                    { c: "DESCENT", r: "INITIATE (FL100 / MEA)" },
                                    { c: "THRUST LEVERS", r: "IDLE" },
                                    { c: "SPEED BRAKES", r: "FULL" }
                                ]
                            },
                            {
                                id: "em_smoke",
                                name: "SMOKE / ELEC SMOKE",
                                items: [
                                    { c: "OXY MASKS", r: "ON / 100% / EMER" },
                                    { c: "CREW COMM", r: "ESTABLISH" },
                                    { c: "ELEC PARTIAL VENTILATION", r: "INITIATE" }
                                ]
                            },
                            {
                                id: "em_loss_brk",
                                name: "LOSS OF BRAKING",
                                items: [
                                    { c: "REV LEVERS", r: "MAX" },
                                    { c: "BRAKE PEDALS", r: "RELEASE" },
                                    { c: "A/SKID & N/W STRG", r: "OFF" },
                                    { c: "BRAKE PEDALS", r: "PRESS MAX 1000 PSI" },
                                    { c: "PARK BRAKE (IF STILL NO BRK)", r: "USE SHORT STROKES" }
                                ]
                            }
                        ]
                    }
                ]
            }
        ];

        let navigationHistory = [];
        let currentActiveChecklist = null;
        let isCurrentEmergency = false;

        function goHome() {
            navigationHistory = [];
            document.getElementById('view-categories').style.display = 'grid';
            document.getElementById('view-list').style.display = 'none';
            document.getElementById('view-checklist').style.display = 'none';
            document.getElementById('btn-back').style.display = 'none';
            document.getElementById('btn-reset-all').style.display = 'block';
            document.getElementById('header-title').innerText = "A320 NORMAL & eQRH";

            const container = document.getElementById('view-categories');
            container.innerHTML = '';
            database.forEach((cat, index) => {
                const isEmg = cat.isEmergency ? 'emergency-cat' : '';
                container.innerHTML += `
                    <div class="card-category ${isEmg}" onclick="openCategory(${index})">
                        <div class="cat-tag">${cat.tag}</div>
                        <div class="cat-title">${cat.title}</div>
                    </div>
                `;
            });
        }

        function openCategory(catIndex, isBack = false) {
            if (!isBack) {
                navigationHistory.push({ type: 'categories' });
            }

            const cat = database[catIndex];
            document.getElementById('view-categories').style.display = 'none';
            document.getElementById('view-list').style.display = 'block';
            document.getElementById('view-checklist').style.display = 'none';
            document.getElementById('btn-back').style.display = 'block';
            document.getElementById('btn-reset-all').style.display = 'none';
            document.getElementById('header-title').innerText = cat.title;

            const container = document.getElementById('view-list');
            container.innerHTML = '';

            cat.groups.forEach(group => {
                let html = `<div class="list-group-title">${group.name}</div>`;
                group.checklists.forEach(chk => {
                    html += `
                        <div class="card-checklist" onclick="loadChecklist('${chk.id}', ${catIndex})">
                            <span class="chk-title">${chk.name}</span>
                            <span class="chk-count">${chk.items.length} ITEMS</span>
                        </div>
                    `;
                });
                container.innerHTML += html;
            });
        }

        function loadChecklist(chkId, catIndex, isBack = false) {
            let foundChk = null;
            let parentCat = null;
            database.forEach(cat => {
                cat.groups.forEach(group => {
                    group.checklists.forEach(chk => {
                        if (chk.id === chkId) {
                            foundChk = chk;
                            parentCat = cat;
                        }
                    });
                });
            });

            if (!foundChk) return;
            currentActiveChecklist = foundChk;
            isCurrentEmergency = parentCat && parentCat.isEmergency;

            if (!isBack) {
                navigationHistory.push({ type: 'category_list', catIndex: catIndex });
            }

            document.getElementById('view-list').style.display = 'none';
            document.getElementById('view-categories').style.display = 'none';
            document.getElementById('view-checklist').style.display = 'block';
            document.getElementById('btn-reset-all').style.display = 'none';
            document.getElementById('btn-back').style.display = 'block';
            document.getElementById('header-title').innerText = foundChk.name;

            renderChecklistRows();
        }

        function goBack() {
            if (navigationHistory.length === 0) {
                goHome();
                return;
            }

            const lastState = navigationHistory.pop();

            if (lastState.type === 'categories') {
                goHome();
            } else if (lastState.type === 'category_list') {
                openCategory(lastState.catIndex, true);
            } else {
                goHome();
            }
        }

        function renderChecklistRows() {
            const container = document.getElementById('view-checklist');
            container.innerHTML = '';

            const card = document.createElement('div');
            card.className = `checklist-card ${isCurrentEmergency ? 'emergency-mode' : ''}`;

            currentActiveChecklist.items.forEach((item) => {
                const row = document.createElement('div');
                row.className = `item-row ${item.checked ? 'checked' : ''}`;
                row.onclick = () => {
                    item.checked = !item.checked;
                    renderChecklistRows();
                };
                row.innerHTML = `
                    <span class="challenge">${item.c}</span>
                    <div class="dots-wrapper">....................................................................</div>
                    <span class="response">${item.r}</span>
                    <div class="checkbox-box">${item.checked ? '✔' : ''}</div>
                `;
                card.appendChild(row);
            });

            container.appendChild(card);
        }

        function resetAllChecklists() {
            database.forEach(cat => {
                cat.groups.forEach(group => {
                    group.checklists.forEach(chk => {
                        chk.items.forEach(item => {
                            item.checked = false;
                        });
                    });
                });
            });
            alert("Toutes les checklists ont été réinitialisées.");
        }

        goHome();
    </script>
</body>
</html>
