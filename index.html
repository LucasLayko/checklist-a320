<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Airbus A320 EFB - Normal & Emergency Procedures</title>
    <style>
        :root {
            --bg: #05080d; --panel: #0d131b; --panel2: #121a24; --line: #232e3b;
            --text: #e8eef5; --muted: #7d8a99; --cyan: #00e5ff; --green: #2bff88;
            --amber: #ffb000; --red: #ff4444;
            --mono: "SF Mono", Menlo, Consolas, "Courier New", monospace;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(ellipse at top, #0c1420 0%, var(--bg) 60%) fixed;
            color: var(--text); font-family: var(--mono); margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none; overflow-x: hidden; min-height: 100vh;
        }
        header {
            position: fixed; top: 0; left: 0; right: 0; height: 64px;
            background: linear-gradient(#141c27, #0d131b);
            padding: env(safe-area-inset-top, 0) 20px 0; height: calc(64px + env(safe-area-inset-top, 0px));
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--line); box-shadow: 0 2px 14px rgba(0,0,0,.6); z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .app-logo {
            background: var(--cyan); color: #001318; font-weight: 900; padding: 6px 11px;
            border-radius: 3px; font-size: 13px; letter-spacing: 2px;
            box-shadow: 0 0 12px rgba(0,229,255,.35);
        }
        .header-title {
            font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45vw;
            border-left: 1px solid var(--line); padding-left: 14px;
        }
        .header-right { display: flex; gap: 10px; align-items: center; }
        .clock { font-size: 14px; color: var(--green); font-weight: 700; letter-spacing: 1px; margin-right: 6px; }
        .btn-efb {
            background: var(--panel2); color: var(--cyan); border: 1px solid #2d3b4b;
            padding: 9px 16px; font-family: var(--mono); font-size: 12px; font-weight: 700;
            letter-spacing: 1px; border-radius: 4px; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
        }
        .btn-efb:active { background: #1c2836; transform: translateY(1px); }
        .btn-reset-all { color: var(--amber); border-color: #5a4310; }

        .main-content {
            margin: calc(84px + env(safe-area-inset-top, 0px)) auto 0; padding: 0 20px 40px;
            max-width: 900px;
        }
        .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
        .card-category {
            background: linear-gradient(160deg, var(--panel2), var(--panel));
            border: 1px solid var(--line); border-top: 3px solid var(--cyan);
            padding: 30px 24px; border-radius: 6px; cursor: pointer; min-height: 130px;
            box-shadow: 0 4px 18px rgba(0,0,0,.5);
        }
        .card-category.emergency-cat { border-top-color: var(--red); }
        .card-category:active { background: #182231; }
        .cat-tag { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; }
        .cat-title { font-size: 19px; font-weight: 700; color: var(--cyan); letter-spacing: 1px; }
        .emergency-cat .cat-title { color: var(--red); }

        .list-group-title {
            color: var(--amber); font-size: 12px; font-weight: 700; letter-spacing: 2px;
            margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
        }
        .card-checklist {
            background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--cyan);
            padding: 20px 22px; margin-bottom: 10px; border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .card-checklist:active { background: var(--panel2); }
        .card-checklist.done { border-left-color: var(--green); }
        .card-checklist.done .chk-title { color: var(--green); }
        .chk-title { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: .5px; }
        .chk-count { font-size: 12px; color: var(--muted); letter-spacing: 1px; }

        .chk-head {
            background: var(--panel2); border: 1px solid var(--line); border-bottom: none;
            border-radius: 6px 6px 0 0; padding: 16px 20px 0;
        }
        .chk-head-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .chk-head-title { font-size: 15px; font-weight: 700; color: var(--cyan); letter-spacing: 1px; }
        .chk-head-count { font-size: 13px; color: var(--muted); font-weight: 700; }
        .progress { height: 4px; background: #1b2533; margin: 0 -20px; }
        .progress-bar { height: 100%; background: var(--green); box-shadow: 0 0 8px var(--green); transition: width .25s; }
        .chk-head.emergency-mode { border-top: 3px solid var(--red); }
        .chk-head.emergency-mode .chk-head-title { color: var(--red); }
        .chk-head.emergency-mode .progress-bar { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

        .checklist-card {
            background: #070b11; border: 1px solid var(--line); border-radius: 0 0 6px 6px;
            overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.5);
        }
        .item-row {
            display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px;
            padding: 17px 20px; border-bottom: 1px solid #141c26; cursor: pointer;
            border-left: 4px solid transparent;
        }
        .item-row:last-child { border-bottom: none; }
        .item-row:active { background: #0e151f; }
        .item-row.active {
            background: rgba(0,229,255,.07); border-left-color: var(--cyan);
            box-shadow: inset 0 0 0 1px rgba(0,229,255,.35);
        }
        .challenge { color: var(--text); font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: .5px; }
        .dots-wrapper {
            overflow: hidden; white-space: nowrap; color: #2a3646; font-size: 14px; letter-spacing: 2px;
        }
        .response { color: var(--cyan); font-size: 15px; font-weight: 700; text-align: right; white-space: nowrap; }
        .checkbox-box {
            width: 28px; height: 28px; border: 2px solid #3a4757; border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: transparent; margin-left: 8px;
        }
        .item-row.active .checkbox-box { border-color: var(--cyan); }
        .item-row.checked .challenge, .item-row.checked .response { color: var(--green) !important; }
        .item-row.checked .dots-wrapper { color: #164a2c; }
        .item-row.checked .checkbox-box {
            border-color: var(--green); background: rgba(43,255,136,.14); color: var(--green);
        }
        .emergency-mode .challenge { color: var(--amber); }
        .emergency-mode .response { color: var(--text); }
        .emergency-mode + .checklist-card .challenge { color: var(--amber); }
        .emergency-mode + .checklist-card .response { color: var(--text); }
        .emergency-mode + .checklist-card .item-row.active { background: rgba(255,176,0,.08); border-left-color: var(--amber); box-shadow: inset 0 0 0 1px rgba(255,176,0,.4); }
        .complete-banner {
            text-align: center; color: var(--green); font-weight: 700; letter-spacing: 3px;
            font-size: 14px; padding: 20px; border-top: 1px solid #164a2c; background: rgba(43,255,136,.06);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <span class="app-logo">FLYSMART</span>
            <span id="header-title" class="header-title">A320 NORMAL & eQRH</span>
        </div>
        <div class="header-right">
            <span id="clock" class="clock"></span>
            <button id="btn-back" class="btn-efb" onclick="goBack()" style="display:none;">&lt; BACK</button>
            <button id="btn-reset-all" class="btn-efb btn-reset-all" onclick="resetAllChecklists()">RESET ALL</button>
        </div>
    </header>

    <div class="main-content">
        <div id="view-categories" class="grid-menu"></div>
        <div id="view-list" style="display:none;"></div>
        <div id="view-checklist" style="display:none;"></div>
    </div>

                                    { c: "ECAM STATUS", r: "CHECKED" },

                                name: "DESCENT/APPROACH",
                                items: [

                                    { c: "ON LANDING DATA", r: "SET" },
                                    { c: "ECAM STATUS", r: "CHECKED" },
                                    { c: "BARO REFERENCE", r: "( )SET" },
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" }
                                ]
                            },
                            {
                                id: "np_bl",
                                name: "BEFORE LANDING",
                                items: [
                                    { c: "CABIN", r: "ADVISED" },
                                    { c: "LANDING GEAR", r: "DOWN" },
                                    { c: "FLAPS", r: "SET LDG" },
                                    { c: "SPOILERS", r: "ARMED" },
                                    { c: "AUTO BRAKE", r: "AS REQUIRED" },
                                    { c: "ENGINE MODE SELECTOR", r: "AS REQUIRED" },
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" },

                                ]
                            },
                            {

                                name: "AFTER LANDING",
                                items: [
                                    { c: "BRAKE FANS", r: "AS REQUIRED" },
                                    { c: "EXTERIOR LIGHTS", r: "AS REQUIRED" },
                                    { c: "STROBE LIGHTS", r: "OFF" },
                                    { c: "ANTI-ICE", r: "OFF" },
                                    { c: "FLAPS", r: "ZERO" },
                                    { c: "SPOILERS", r: "DISARMED & RETRACTED" },
                                    { c: "ENGINE MODE SELECTOR", r: "NORMAL" },
                                    { c: "WEATHER RADAR/PWS", r: "OFF" },
                                    { c: "TCAS", r: "STBY" },
                                    { c: "APU", r: "ON" }
                                ]
                            }
                        ]
                    },
                    {
                        name: "PARKING & SHUTDOWN",
                        checklists: [
                            {
                                id: "np_pk",
                                name: "PARKING",
                                items: [

                                    { c: "BRAKE FANS", r: "OFF" },
                                    { c: "PARKING BRAKE", r: "ON" },
                                    { c: "ENGINE MASTERS", r: "OFF" },
                                    { c: "BEACON", r: "OFF" },
                                    { c: "FUEL PUMPS", r: "OFF" },
                                    { c: "SEATBELT SIGNS", r: "OFF" },
                                    { c: "TRANSPONDER", r: "STBY" },
                                    { c: "CHOCKS/PARKING BRAKE", r: "SET/OFF" },
                                    { c: "ELECTRICAL POWER", r: "(EXT or APU) ON" },
                                    { c: "APU BLEED", r: "AS REQUIRED" }
                                ]
                            },
                            {
                                id: "np_sd",
                                name: "SHUTDOWN",
                                items: [
                                    { c: "ADIRS", r: "OFF" },
                                    { c: "CREW SUPPLY", r: "OFF" },
                                    { c: "NAV & LOGO LIGHTS", r: "OFF" },
                                    { c: "NO SMOKING SIGNS", r: "OFF" },
                                    { c: "EMERGENCY EXIT LIGHTS", r: "OFF" },
                                    { c: "APU BLEED/APU", r: "OFF" },
                                    { c: "EXTERNAL POWER/GPU", r: "OFF/DISCONNECTED" },
                                    { c: "INTERIOR LIGHTS", r: "OFF" },

            {
                id: "emergency",
                tag: "EMERGENCY & eQRH",
                title: "02. EMERGENCY PROCEDURES",
                isEmergency: true,
                groups: [
                    {
                        name: "ENGINE & FIRE PROCEDURES",
                        checklists: [
                            {
                                id: "em_eng_fire",
                                name: "ENG 1(2) FIRE IN FLIGHT",

                                    { c: "ENG MASTER (AFFECTED)", r: "OFF" },
                                    { c: "ENG FIRE BUTTON", r: "PUSH" },
                                    { c: "AGENT 1 (AFTER 10s)", r: "DISCHARGE" },
                                    { c: "AGENT 2 (IF FIRE PERSISTS 30s)", r: "DISCHARGE" },
                                    { c: "ATC", r: "MAYDAY NOTIFY" }
                                ]
                            },
                            {
                                id: "em_apu_fire",
                                name: "APU FIRE IN FLIGHT / ON GND",
                                items: [
                                    { c: "APU FIRE BUTTON", r: "PUSH" },
                                    { c: "APU AGENT", r: "DISCHARGE" }
                                ]
                            },
                            {
                                id: "em_dual_eng_fail",
                                name: "ENG DUAL FAILURE",
                                items: [
                                    { c: "OPTIMUM SPEED", r: "300 KT / GREEN DOT" },
                                    { c: "ENG MASTERS", r: "OFF / ON" },
                                    { c: "APU MASTER", r: "ON" }
                                ]

                        ]
                    },
                    {
                        name: "CABIN & AIRFRAME EMERGENCIES",
                        checklists: [
                            {

                                items: [

                                    { c: "DESCENT", r: "INITIATE (FL100 / MEA)" },
                                    { c: "THRUST LEVERS", r: "IDLE" },
                                    { c: "SPEED BRAKES", r: "FULL" }
                                ]
                            },
                            {

                                name: "SMOKE / ELEC SMOKE",

                                    { c: "ELEC PARTIAL VENTILATION", r: "INITIATE" }
                                ]
                            },
                            {
                                id: "em_loss_brk",
                                name: "LOSS OF BRAKING",
                                items: [
                                    { c: "REV LEVERS", r: "MAX" },
                                    { c: "BRAKE PEDALS", r: "RELEASE" },
                                    { c: "A/SKID & N/W STRG", r: "OFF" },
                                    { c: "BRAKE PEDALS", r: "PRESS MAX 1000 PSI" },
                                    { c: "PARK BRAKE (IF STILL NO BRK)", r: "USE SHORT STROKES" }
                                ]
                            }
                        ]
                    }
                ]
            }
        ];

        // ============================================================
        // SAUVEGARDE (localStorage) : coches + écran courant
        // ============================================================
        const STORAGE_KEY = 'a320_efb_state_v1';

        let navigationHistory = [];
        let currentActiveChecklist = null;
        let isCurrentEmergency = false;
        // Vue courante : { view: 'home' | 'list' | 'checklist', catIndex, chkId }
        let currentView = { view: 'home' };

        function saveState() {
            try {
                const checks = {};
                database.forEach(cat => cat.groups.forEach(group => group.checklists.forEach(chk => {
                    const arr = chk.items.map(it => !!it.checked);
                    if (arr.some(Boolean)) checks[chk.id] = arr;
                })));
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ checks, currentView }));
            } catch (e) { /* stockage indisponible : on ignore */ }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const state = JSON.parse(raw);
                const checks = state.checks || {};
                database.forEach(cat => cat.groups.forEach(group => group.checklists.forEach(chk => {
                    const arr = checks[chk.id];
                    if (Array.isArray(arr)) {
                        chk.items.forEach((it, i) => { it.checked = !!arr[i]; });
                    }
                })));
                return state.currentView || null;
            } catch (e) { return null; }
        }

        // Sécurité supplémentaire : sauvegarde quand l'app passe en arrière-plan
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') saveState();
        });
        window.addEventListener('pagehide', saveState);

        // ============================================================
        // NAVIGATION
        // ============================================================
        function goHome() {
            navigationHistory = [];
            currentView = { view: 'home' };
            document.getElementById('view-categories').style.display = 'grid';
            document.getElementById('view-list').style.display = 'none';
            document.getElementById('view-checklist').style.display = 'none';
            document.getElementById('btn-back').style.display = 'none';
            document.getElementById('btn-reset-all').style.display = 'block';
            document.getElementById('header-title').innerText = "A320 NORMAL & eQRH";

            const container = document.getElementById('view-categories');
            container.innerHTML = '';
            database.forEach((cat, index) => {
                const isEmg = cat.isEmergency ? 'emergency-cat' : '';
                container.innerHTML += `
                    <div class="card-category ${isEmg}" onclick="openCategory(${index})">
                        <div class="cat-tag">${cat.tag}</div>
                        <div class="cat-title">${cat.title}</div>
                    </div>
                `;
            });
            saveState();
        }

        function openCategory(catIndex, isBack = false) {
            if (!isBack) {
                navigationHistory.push({ type: 'categories' });
            }
            currentView = { view: 'list', catIndex: catIndex };

            const cat = database[catIndex];
            document.getElementById('view-categories').style.display = 'none';
            document.getElementById('view-list').style.display = 'block';
            document.getElementById('view-checklist').style.display = 'none';
            document.getElementById('btn-back').style.display = 'block';
            document.getElementById('btn-reset-all').style.display = 'none';
            document.getElementById('header-title').innerText = cat.title;

            const container = document.getElementById('view-list');
            container.innerHTML = '';

            cat.groups.forEach(group => {
                let html = `<div class="list-group-title">${group.name}</div>`;
                group.checklists.forEach(chk => {
                    html += `
                        <div class="card-checklist ${chk.items.every(i => i.checked) ? 'done' : ''}" onclick="loadChecklist('${chk.id}', ${catIndex})">
                            <span class="chk-title">${chk.name}</span>
                            <span class="chk-count">${chk.items.filter(i => i.checked).length}/${chk.items.length} ITEMS</span>
                        </div>
                    `;
                });
                container.innerHTML += html;
            });
            saveState();
        }

        function loadChecklist(chkId, catIndex, isBack = false) {
            let foundChk = null;
            let parentCat = null;
            database.forEach(cat => {
                cat.groups.forEach(group => {
                    group.checklists.forEach(chk => {
                        if (chk.id === chkId) {
                            foundChk = chk;
                            parentCat = cat;
                        }
                    });
                });
            });

            if (!foundChk) return;
            currentActiveChecklist = foundChk;
            isCurrentEmergency = parentCat && parentCat.isEmergency;

            if (!isBack) {
                navigationHistory.push({ type: 'category_list', catIndex: catIndex });
            }
            currentView = { view: 'checklist', catIndex: catIndex, chkId: chkId };

            document.getElementById('view-list').style.display = 'none';
            document.getElementById('view-categories').style.display = 'none';
            document.getElementById('view-checklist').style.display = 'block';
            document.getElementById('btn-reset-all').style.display = 'none';
            document.getElementById('btn-back').style.display = 'block';
            document.getElementById('header-title').innerText = foundChk.name;

            renderChecklistRows();
            saveState();
        }

        function goBack() {
            if (navigationHistory.length === 0) {
                goHome();
                return;
            }

            const lastState = navigationHistory.pop();

            if (lastState.type === 'categories') {
                goHome();
            } else if (lastState.type === 'category_list') {
                openCategory(lastState.catIndex, true);
            } else {
                goHome();
            }
        }

        function renderChecklistRows() {
            const container = document.getElementById('view-checklist');
            container.innerHTML = '';
            const items = currentActiveChecklist.items;
            const done = items.filter(i => i.checked).length;
            const activeIdx = items.findIndex(i => !i.checked);

            const head = document.createElement('div');
            head.className = `chk-head ${isCurrentEmergency ? 'emergency-mode' : ''}`;
            head.innerHTML = `
                <div class="chk-head-top">
                    <span class="chk-head-title">${currentActiveChecklist.name}</span>
                    <span class="chk-head-count">${done}/${items.length}</span>
                </div>
                <div class="progress"><div class="progress-bar" style="width:${done / items.length * 100}%"></div></div>`;
            container.appendChild(head);

            const card = document.createElement('div');
            card.className = 'checklist-card';

            items.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = `item-row ${item.checked ? 'checked' : ''} ${idx === activeIdx ? 'active' : ''}`;
                row.onclick = () => {
                    item.checked = !item.checked;
                    saveState();
                    renderChecklistRows();
                };
                row.innerHTML = `
                    <span class="challenge">${item.c}</span>
                    <div class="dots-wrapper">....................................................................</div>
                    <span class="response">${item.r}</span>
                    <div class="checkbox-box">${item.checked ? '✔' : ''}</div>
                `;
                card.appendChild(row);
            });

            if (done === items.length) {
                const ok = document.createElement('div');
                ok.className = 'complete-banner';
                ok.innerText = 'CHECKLIST COMPLETE';
                card.appendChild(ok);
            }
            container.appendChild(card);
        }

        function resetAllChecklists() {
            if (!confirm("Réinitialiser toutes les checklists ?")) return;
            database.forEach(cat => {
                cat.groups.forEach(group => {
                    group.checklists.forEach(chk => {
                        chk.items.forEach(item => {
                            item.checked = false;
                        });
                    });
                });
            });
            saveState();
        }

        function tickClock() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            document.getElementById('clock').innerText = `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} UTC`;
        }
        tickClock();
        setInterval(tickClock, 1000);

        // ============================================================
        // DÉMARRAGE : restaure les coches et l'écran où tu étais
        // ============================================================
        const saved = loadState();
        if (saved && saved.view === 'list' && database[saved.catIndex]) {
            navigationHistory = [{ type: 'categories' }];
            openCategory(saved.catIndex, true);
        } else if (saved && saved.view === 'checklist' && database[saved.catIndex]) {
            navigationHistory = [{ type: 'categories' }, { type: 'category_list', catIndex: saved.catIndex }];
            loadChecklist(saved.chkId, saved.catIndex, true);
            if (!currentActiveChecklist || currentView.view !== 'checklist') goHome();
        } else {
            goHome();
        }
    </script>
</body>
</html>
